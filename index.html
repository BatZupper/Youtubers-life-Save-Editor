<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youtubers Life Save Editor (YLS Editor Online)</title>

  <!-- SEO Metadata -->
  <meta name="description" content="Edit your Youtubers Life save files (.yls) easily online! Upload, view, modify, and re-save your game data using this free browser-based YLS Editor.">
  <meta name="keywords" content="Youtubers Life, save editor, YLS file, game save, decompress YLS, edit save, Youtubers Life mod, browser editor, online save editor">
  <meta name="author" content="BatZupper">

  <!-- Open Graph for social media -->
  <meta property="og:title" content="Youtubers Life Save Editor (YLS Editor Online)">
  <meta property="og:description" content="Edit and save Youtubers Life .yls files online. Upload, decompress, and modify your game data easily in your browser.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://batzupper.github.io/Youtubers-life-Save-Editor/">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    input[type="file"], button {
      margin-top: 10px;
      padding: 10px 15px;
      font-size: 16px;
    }
    .group {
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .group-header {
      background-color: #f9f9f9;
      padding: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    .group-content {
      display: none;
      padding: 10px;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
    }
    .data-table th, .data-table td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    .data-table input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      border: none;
      background: transparent;
      padding: 4px;
    }
    .data-table input[type="text"]:focus {
      outline: 1px solid #007BFF;
      background: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>Youtubers Life Save Editor (YLS File Editor)</h1>
    <p>Edit your <strong>.yls</strong> save files from Youtubers Life directly in your browser. No installation needed!</p>
  </header>

  <main>
    <input type="file" id="fileInput" accept=".yls">
    <div id="dataContainer"></div>
    <br>
    <button id="saveButton">Save Edited File</button>
  </main>

  <footer style="margin-top: 40px; font-size: 14px; color: #555;">
    <p>© 2025 YLS Editor — Free Online Save File Tool for <em>Youtubers Life</em></p>
  </footer>

  <script>
    // Convert a Base64 string to Uint8Array
    function base64ToUint8Array(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes;
    }

    // Convert a Uint8Array to a Base64 string
    function uint8ArrayToBase64(uint8Array) {
      let binaryString = '';
      for (let i = 0; i < uint8Array.length; i++) {
        binaryString += String.fromCharCode(uint8Array[i]);
      }
      return btoa(binaryString);
    }

    document.getElementById('fileInput').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const arrayBuffer = await file.arrayBuffer();
      const base64String = new TextDecoder().decode(arrayBuffer);
      const compressedData = base64ToUint8Array(base64String);

      try {
        const decompressed = pako.inflate(compressedData, { to: 'string' });
        displayGroups(decompressed);
      } catch (error) {
        alert('Unable to unzip file: ' + error.message);
      }
    });

    // Display decompressed content grouped into editable tables
    function displayGroups(content) {
      const container = document.getElementById('dataContainer');
      container.innerHTML = '';

      const lines = content.trim().split('\n');
      let currentGroup = null;
      let table = null;
      let isHeaderAdded = false;

      lines.forEach(line => {
        if (line.startsWith('###')) {
          // Start of a new group
          currentGroup = document.createElement('div');
          currentGroup.className = 'group';

          const header = document.createElement('div');
          header.className = 'group-header';
          header.textContent = line.substring(3).trim();

          const contentDiv = document.createElement('div');
          contentDiv.className = 'group-content';

          header.addEventListener('click', () => {
            contentDiv.style.display = contentDiv.style.display === 'none' ? 'block' : 'none';
          });

          currentGroup.appendChild(header);
          currentGroup.appendChild(contentDiv);
          container.appendChild(currentGroup);

          // Create a new table for the current group
          table = document.createElement('table');
          table.className = 'data-table';
          contentDiv.appendChild(table);
          isHeaderAdded = false;
        } else if (table) {
          // Split line into cells (tab-separated)
          const rowData = line.split('\t');

          // Create header or data row
          const row = document.createElement('tr');
          rowData.forEach(cellData => {
            const cell = document.createElement(isHeaderAdded ? 'td' : 'th');
            const input = document.createElement('input');
            input.type = 'text';
            input.value = cellData;
            input.style.width = '100%';
            cell.appendChild(input);
            row.appendChild(cell);
          });

          table.appendChild(row);
          if (!isHeaderAdded) isHeaderAdded = true;
        }
      });
    }

    // Gather edited data from all tables and join into TSV format
    function getGroupData() {
      const groups = document.querySelectorAll('.group');
      const lines = [];

      groups.forEach(group => {
        const header = group.querySelector('.group-header').textContent;
        lines.push('###' + header);
        const rows = group.querySelectorAll('table.data-table tr');
        rows.forEach(row => {
          const inputs = row.querySelectorAll('input');
          if (inputs.length > 0) {
            const rowData = Array.from(inputs).map(input => input.value).join('\t');
            lines.push(rowData);
          }
        });
      });

      return lines.join('\n');
    }

    document.getElementById('saveButton').addEventListener('click', () => {
      const content = getGroupData();
      try {
        const compressed = pako.gzip(content);
        const base64String = uint8ArrayToBase64(compressed);
        const blob = new Blob([base64String], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = 'edited.yls';
        a.click();

        URL.revokeObjectURL(url);
      } catch (error) {
        alert('Unable to compress file: ' + error.message);
      }
    });
  </script>
</body>
</html>
